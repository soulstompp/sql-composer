[workspace]
resolver = "2"
members = ["crates/*", "examples/brick", "examples/sqlc-brickgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/soulstompp/sql-composer"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
sql-composer = { version = "0.1.0", path = "crates/sql-composer" }
clap = { version = "4", features = ["derive", "env"] }
duckdb = "1.4"
rusqlite = "0.40"
sqlx = { version = "0.9", default-features = false }
tempfile = "3.26.0"
thiserror = "2"
tokio = "1"
walkdir = "2"
