[package]
name = "cargo-sqlc"
version.workspace = true
description = "Cargo subcommand for composing SQL templates with sql-composer"
keywords = ["sql", "cargo", "subcommand", "composer"]
categories = ["command-line-utilities", "database"]
repository.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "cargo-sqlc"
path = "src/main.rs"

[dependencies]
sql-composer = { workspace = true, features = ["serde", "respell", "spellings"] }
clap.workspace = true
walkdir.workspace = true
tempfile.workspace = true

[dev-dependencies]
serde_json = "1"
