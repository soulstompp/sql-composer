[package]
name = "sql-composer-mysql"
version = "0.0.5"
description = "MySQL driver for sql-composer SQL template engine (sync and async)"
keywords = ["sql", "template", "composer", "mysql"]
repository = "https://github.com/soulstompp/sql-composer"
license = "MIT"
edition = "2021"

[dependencies]
sql-composer = { version = "0.0.5", path = "../sql-composer" }
mysql_async = "0.37"
mysql = { version = "28", optional = true }
thiserror = "2"

[features]
default = ["sync", "async"]
sync = ["dep:mysql"]
async = []
