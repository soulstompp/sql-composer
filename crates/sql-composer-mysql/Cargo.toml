[package]
name = "sql-composer-mysql"
version.workspace = true
description = "MySQL driver for sql-composer SQL template engine (sync and async)"
keywords = ["sql", "template", "composer", "mysql"]
categories = ["database"]
repository.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version = "1.89"

[dependencies]
sql-composer.workspace = true
mysql_async = "0.37"
mysql = { version = "28", optional = true }
thiserror.workspace = true

[features]
default = ["sync", "async"]
sync = ["dep:mysql"]
async = []
