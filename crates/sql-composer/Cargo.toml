[package]
name = "sql-composer"
version.workspace = true
description = "SQL template engine that composes reusable SQL fragments with parameterized bindings"
keywords = ["sql", "template", "composer", "parser", "winnow"]
categories = ["parser-implementations", "database"]
repository.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
winnow = "1"
thiserror.workspace = true
walkdir.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sqlparser = { workspace = true, optional = true, features = ["visitor"] }
toml = { version = "1.1", optional = true, default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
tempfile.workspace = true
postgres = "0.19"

[features]
default = ["std"]
std = ["winnow/std"]
serde = ["dep:serde", "dep:serde_json"]
respell = ["dep:sqlparser"]
spellings = ["dep:sqlparser", "dep:serde", "dep:toml"]
