[package]
name = "brick-example"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "brick"
path = "src/main.rs"

[dependencies]
sql-composer = { workspace = true, features = ["spellings"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
# sqlx-postgres 0.9.0 builds whoami without `std`, so a URL that names no user connects as
# `anonymous`; whoami's default features have it read the operating system's user again.
whoami = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile.workspace = true
walkdir.workspace = true
